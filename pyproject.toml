[project]
name = "production-rag-platform"
version = "0.2.0"
description = "Production-grade RAG platform: Milvus, FastAPI, RAGAS evaluation, Kubernetes, CI/CD and observability. Runs on local Ollama models or the OpenAI API."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pymilvus>=2.4.0",
    "chromadb>=0.5.0",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "numpy>=1.26.0",
    "tqdm>=4.66.0",
    "pypdf>=6.14.2",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
# The OpenAI SDK is deliberately optional: the default provider is local Ollama,
# which needs nothing beyond httpx.
openai = [
    "openai>=1.40.0",
]
dev = [
    "pytest>=8.2.0",
    "ruff>=0.5.0",
    "pre-commit>=3.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["api", "ingestion"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# tests/ has no __init__.py, so pytest puts tests/ - not the repo root - on
# sys.path. Without this the suite only imports `api`/`ingestion` when the
# project itself has been installed into the venv, which bites on a fresh
# clone and on CI runners.
pythonpath = ["."]
addopts = "-q"
markers = [
    "integration: requires a running service (Milvus, Ollama) or an API key",
]
