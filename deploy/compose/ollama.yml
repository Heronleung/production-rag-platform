# Local model runtime. Nothing here needs an API key or an internet connection
# once the models are pulled.
#
#   docker compose -f deploy/compose/ollama.yml up -d
#   docker exec rag-ollama ollama pull nomic-embed-text
#   docker exec rag-ollama ollama pull qwen2.5:1.5b
#
# The models must be pulled *inside* the container. A native `ollama pull` on the
# host writes to ~/.ollama, which this container cannot see; its model store is
# the ./volumes/ollama bind mount instead.
#
# Running Ollama here rather than as a host process is what makes it survive a
# reboot: `restart: unless-stopped` brings it back with Docker, while a host
# `ollama serve` dies with its shell and with every `wsl --shutdown`.
#
# On a machine with an NVIDIA GPU, uncomment the deploy block below. Without a
# GPU it still runs on CPU, only slower; embedding models are small enough that
# CPU is perfectly usable for Phase 1.

name: rag-ollama

services:
  ollama:
    container_name: rag-ollama
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ./volumes/ollama:/root/.ollama
    environment:
      OLLAMA_KEEP_ALIVE: "10m"
      OLLAMA_NUM_PARALLEL: "2"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      start_period: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
