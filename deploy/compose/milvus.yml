# Milvus standalone for local development.
#
# Milvus standalone is three services, not one:
#   etcd  -> metadata (collection schemas, index state)
#   minio -> object storage for the actual vector segments
#   milvus-> query/index/data nodes running in a single process
#
# Volumes are bind-mounted to disk on purpose. Using tmpfs or an anonymous
# volume means every container restart silently drops the whole collection.
#
# All three services use `restart: unless-stopped`. Docker Desktop can be set to
# start with the host, but a stopped container stays stopped, so without this
# every reboot leaves Milvus down and the scripts fail late, at MilvusClient(),
# with an opaque grpc timeout. `unless-stopped` (not `always`) is deliberate: an
# explicit `docker stop` stays honoured until you start it again.

name: rag-milvus

services:
  etcd:
    container_name: rag-milvus-etcd
    image: quay.io/coreos/etcd:v3.5.14
    restart: unless-stopped
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    command:
      - etcd
      - --advertise-client-urls=http://127.0.0.1:2379
      - --listen-client-urls=http://0.0.0.0:2379
      - --data-dir=/etcd
    volumes:
      - ./volumes/etcd:/etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3

  minio:
    container_name: rag-milvus-minio
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    restart: unless-stopped
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    command: minio server /minio_data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ./volumes/minio:/minio_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  milvus:
    container_name: rag-milvus-standalone
    image: milvusdb/milvus:v2.4.9
    restart: unless-stopped
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    volumes:
      - ./volumes/milvus:/var/lib/milvus
    ports:
      - "19530:19530"   # gRPC / SDK
      - "9091:9091"     # metrics + healthz
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3
    depends_on:
      - etcd
      - minio
