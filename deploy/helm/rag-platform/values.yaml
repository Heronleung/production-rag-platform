nameOverride: ""
fullnameOverride: ""
imagePullSecrets: []

api:
  replicaCount: 1
  image:
    repository: rag-api
    tag: dev
    pullPolicy: IfNotPresent
  service:
    port: 8000
  existingSecret: ""
  env:
    EMBEDDING_PROVIDER: ollama
    LLM_PROVIDER: ollama
    OLLAMA_BASE_URL: http://host.docker.internal:11434
    OLLAMA_EMBEDDING_MODEL: nomic-embed-text
    OLLAMA_LLM_MODEL: qwen2.5:1.5b
    OLLAMA_TIMEOUT_SECONDS: "120"
    MILVUS_URI: http://host.docker.internal:19530
    MILVUS_COLLECTION: rag_chunks
    MILVUS_METRIC_TYPE: COSINE
    MILVUS_HNSW_M: "16"
    MILVUS_HNSW_EF_CONSTRUCTION: "200"
    MILVUS_HNSW_EF_SEARCH: "64"
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 2Gi
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    fsGroup: 10001
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: ["ALL"]
  probes:
    startup:
      initialDelaySeconds: 2
      periodSeconds: 5
      failureThreshold: 24
    liveness:
      periodSeconds: 10
      failureThreshold: 3
    readiness:
      periodSeconds: 10
      failureThreshold: 3
      timeoutSeconds: 5

web:
  replicaCount: 1
  image:
    repository: rag-web
    tag: dev
    pullPolicy: IfNotPresent
  service:
    port: 3000
  ragApiUrl: ""
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: "1"
      memory: 512Mi
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: ["ALL"]

serviceAccount:
  create: true
  annotations: {}

ingress:
  enabled: false
  className: nginx
  host: rag.local
  annotations:
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-request-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "180"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "180"
    nginx.ingress.kubernetes.io/proxy-body-size: "26m"
  tls: []

podDisruptionBudget:
  enabled: false
  minAvailable: 1

networkPolicy:
  enabled: false
  ingressNamespace: ingress-nginx
  allowedExternalCIDRs: []
