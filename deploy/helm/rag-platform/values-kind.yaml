api:
  image:
    repository: rag-api
    tag: dev
    pullPolicy: IfNotPresent
  env:
    OLLAMA_BASE_URL: http://host.docker.internal:11434
    OLLAMA_EMBEDDING_MODEL: nomic-embed-text
    OLLAMA_LLM_MODEL: qwen2.5:3b
    MILVUS_URI: http://host.docker.internal:19530

web:
  image:
    repository: rag-web
    tag: dev
    pullPolicy: IfNotPresent

ingress:
  enabled: true
  className: nginx
  host: rag.local
