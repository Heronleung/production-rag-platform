name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python / lint and offline tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.3"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install Python
        run: uv python install 3.11
      - name: Sync locked development environment
        run: uv sync --frozen --extra dev
      - name: Ruff
        run: uv run ruff check api tests
      - name: Offline tests
        run: uv run pytest -m "not integration"

  web:
    name: Web / lint, typecheck, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Production build
        run: npm run build
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

  helm:
    name: Helm / lint and render
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.18.4
      - name: Lint chart
        run: >-
          helm lint deploy/helm/rag-platform
          -f deploy/helm/rag-platform/values-kind.yaml
      - name: Render immutable CI images
        run: |
          helm template rag deploy/helm/rag-platform \
            --namespace rag \
            -f deploy/helm/rag-platform/values-kind.yaml \
            --set-string "api.image.tag=ci-${GITHUB_SHA}" \
            --set-string "web.image.tag=ci-${GITHUB_SHA}" \
            > /tmp/rag-rendered.yaml
          grep -F "rag-api:ci-${GITHUB_SHA}" /tmp/rag-rendered.yaml
          grep -F "rag-web:ci-${GITHUB_SHA}" /tmp/rag-rendered.yaml

  images:
    name: Containers / build images
    needs: [python, web, helm]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build API image without pushing
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.api
          push: false
          tags: rag-api:ci-${{ github.sha }}
      - name: Build web image without pushing
        uses: docker/build-push-action@v6
        with:
          context: ./web
          file: ./web/Dockerfile
          push: false
          tags: rag-web:ci-${{ github.sha }}
